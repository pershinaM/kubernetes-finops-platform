apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-finops-labels
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: require-finops-workload-labels
      match:
        any:
          - resources:
              kinds:
                - Deployment
                - StatefulSet
                - DaemonSet
      validate:
        message: "Workloads must define required FinOps ownership labels."
        pattern:
          metadata:
            labels:
              app.kubernetes.io/name: "?*"
              app.kubernetes.io/component: "?*"
              finops.openai.io/product: "?*"
              finops.openai.io/team: "?*"
              finops.openai.io/environment: "?*"
              finops.openai.io/component: "?*"
          spec:
            template:
              metadata:
                labels:
                  app.kubernetes.io/name: "?*"
                  app.kubernetes.io/component: "?*"
                  finops.openai.io/product: "?*"
                  finops.openai.io/team: "?*"
                  finops.openai.io/environment: "?*"
                  finops.openai.io/component: "?*"
