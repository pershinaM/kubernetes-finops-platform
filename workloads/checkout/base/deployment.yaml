apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  labels:
    app.kubernetes.io/name: checkout
    app.kubernetes.io/component: api
    finops.openai.io/product: commerce
    finops.openai.io/team: payments
    finops.openai.io/environment: prod
    finops.openai.io/component: application
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: checkout
  template:
    metadata:
      labels:
        app.kubernetes.io/name: checkout
        app.kubernetes.io/component: api
        finops.openai.io/product: commerce
        finops.openai.io/team: payments
        finops.openai.io/environment: prod
        finops.openai.io/component: application
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5678"
    spec:
      containers:
        - name: checkout
          image: hashicorp/http-echo:1.0.0
          args:
            - -text=checkout
            - -listen=:5678
          ports:
            - containerPort: 5678
              name: http
          resources:
            requests:
              cpu: 150m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
