apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: workloads-local
  namespace: argocd
spec:
  project: finops-platform
  source:
    repoURL: https://github.com/pershinaM/kubernetes-finops-platform.git
    targetRevision: HEAD
    path: workloads/local
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
